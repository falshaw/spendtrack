# =============================================================================
# SpendTrack - Docker Compose
# =============================================================================
#   cp .env.example .env    # fill in every change-me value
#   docker compose up -d --build
#
# Host ports (all bound to 127.0.0.1, override in .env):
#   app        SPENDTRACK_PORT         default 3000
#   parser     SPENDTRACK_PARSER_PORT  default 18000 (only needed for npm run dev)
#   postgres   SPENDTRACK_DB_PORT      default 15432 (only needed for npm run dev)
#
# Receipts are read by a vision model in Ollama running on the HOST
# (http://host.docker.internal:11434). Nothing leaves the machine unless you
# switch SPENDTRACK_RECEIPT_ENGINE to "openrouter".
# =============================================================================

services:
  spendtrack-postgres:
    image: postgres:16.16-alpine@sha256:0adbf25a9e96d38823bb813f3ac0ed41fadb665c88f1df7fe6dbfb060cbdc106
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${SPENDTRACK_DB_PORT:-15432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: spendtrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      SPENDTRACK_APP_DB_PASSWORD: ${SPENDTRACK_APP_DB_PASSWORD:?SPENDTRACK_APP_DB_PASSWORD required in .env}
    volumes:
      - spendtrack-pgdata:/var/lib/postgresql/data
      - ./database/init-app-user.sh:/docker-entrypoint-initdb.d/init-app-user.sh:ro
    networks:
      - spendtrack-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
          pids: 200
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -d spendtrack"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # One-shot: applies the migrations and seeds the admin user + default categories,
  # connected as the postgres superuser (the runtime role has no CREATE on public).
  # Idempotent — safe on every `up`. Runs as the image's unprivileged `node` user
  # (uid 1000) with every capability dropped; the seed refuses placeholder secrets.
  spendtrack-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    restart: "no"
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx prisma/seed.ts"]
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@spendtrack-postgres:5432/spendtrack
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-admin@example.com}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD required in .env (12+ characters)}
      - SPENDTRACK_APP_DB_PASSWORD=${SPENDTRACK_APP_DB_PASSWORD:?SPENDTRACK_APP_DB_PASSWORD required in .env}
      - HOME=/tmp
      - npm_config_cache=/tmp/.npm
    user: "1000:1000"
    depends_on:
      spendtrack-postgres:
        condition: service_healthy
    networks:
      - spendtrack-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=100m

  # Bank-statement parsers behind HTTP: a file dropped in the browser goes through
  # the Python parsers and the reconciliation against the statement's printed
  # totals. Also reads receipt photos via the local vision model on the host.
  spendtrack-parser:
    build:
      context: .
      dockerfile: Dockerfile.parser
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      # Loopback only. Exposed so `npm run dev` on the host can reach the parser too.
      - "127.0.0.1:${SPENDTRACK_PARSER_PORT:-18000}:8000"
    environment:
      - OLLAMA_URL=${SPENDTRACK_OLLAMA_URL:-http://host.docker.internal:11434}
      - SPENDTRACK_VLM_MODEL=${SPENDTRACK_VLM_MODEL:-qwen2.5vl:7b}
      # Receipt engine: `ollama` (local, default) or `openrouter` (optional cloud
      # fallback). The local engine needs no key, so these are all optional.
      - SPENDTRACK_RECEIPT_ENGINE=${SPENDTRACK_RECEIPT_ENGINE:-ollama}
      - SPENDTRACK_OPENROUTER_MODEL=${SPENDTRACK_OPENROUTER_MODEL:-google/gemma-4-31b-it:free}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # MUST equal the app's PARSER_TOKEN or every upload answers 401 (fail-closed when unset)
      - PARSER_TOKEN=${PARSER_TOKEN:?PARSER_TOKEN required in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - spendtrack-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
          pids: 200
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=200m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5).status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  spendtrack-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${SPENDTRACK_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://spendtrack_app:${SPENDTRACK_APP_DB_PASSWORD}@spendtrack-postgres:5432/spendtrack
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET required in .env}
      - PARSER_URL=http://spendtrack-parser:8000
      - PARSER_TOKEN=${PARSER_TOKEN:?PARSER_TOKEN required in .env}
      # Host allowlist (DNS-rebinding guard). Must include the host:port you open in the browser.
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-127.0.0.1:${SPENDTRACK_PORT:-3000},localhost:${SPENDTRACK_PORT:-3000},127.0.0.1:3000,localhost:3000}
      - CARDHOLDER_NAME=${CARDHOLDER_NAME:-}
      - SAFE_TO_DRAW_TAX_RATE=${SAFE_TO_DRAW_TAX_RATE:-0.25}
      - SAFE_TO_DRAW_MONTHLY_BUDGET=${SAFE_TO_DRAW_MONTHLY_BUDGET:-2000}
      - SAFE_TO_DRAW_SINCE=${SAFE_TO_DRAW_SINCE:-2000-01-01}
      # Investments (all optional, read-only). Unset = "not connected"; see .env.example.
      - TRADING212_API_KEY=${TRADING212_API_KEY:-}
      - TRADING212_API_SECRET=${TRADING212_API_SECRET:-}
      - TRADING212_ENV=${TRADING212_ENV:-live}
      - IBKR_FLEX_TOKEN=${IBKR_FLEX_TOKEN:-}
      - IBKR_FLEX_QUERY_ID=${IBKR_FLEX_QUERY_ID:-}
      - BROKER_SYNC_USER_EMAIL=${BROKER_SYNC_USER_EMAIL:-}
    depends_on:
      spendtrack-init:
        condition: service_completed_successfully
      spendtrack-postgres:
        condition: service_healthy
      spendtrack-parser:
        condition: service_healthy
    networks:
      - spendtrack-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
          pids: 200
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=100m
      - /app/.next/cache:size=200m
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  spendtrack-pgdata:

networks:
  spendtrack-network:
    driver: bridge
